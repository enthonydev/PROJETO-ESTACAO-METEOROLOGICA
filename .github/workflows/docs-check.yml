name: Checks de documentação, contrato e código

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-baseline:
    name: Validar baseline e contrato
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências do backend
        run: python -m pip install -r backend/requirements.txt

      - name: Verificar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTRIBUTING.md
          test -s docs/arquitetura/arquitetura-sistema.md
          test -s docs/arquitetura/adr/ADR-001-baseline-tecnica.md
          test -s docs/contratos/contratos-integracao.md
          test -s docs/contratos/telemetria-v1.0.json
          test -s docs/contratos/examples/telemetry-v1.0-valid.json
          test -s docs/contratos/examples/telemetry-v1.0-partial.json
          test -s scripts/validate_contract.py

      - name: Validar JSON e contrato
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool docs/contratos/telemetria-v1.0.json >/dev/null
          python -m json.tool docs/contratos/examples/telemetry-v1.0-valid.json >/dev/null
          python -m json.tool docs/contratos/examples/telemetry-v1.0-partial.json >/dev/null
          python scripts/validate_contract.py

      - name: Testar backend
        run: PYTHONPATH=backend python -m pytest backend/tests -q

      - name: Testar firmware estrutural
        run: PYTHONPATH=firmware/src python -m pytest firmware/tests -q

      - name: Verificar compilação Python
        run: python -m compileall -q backend/app backend/tests firmware/src firmware/tests
